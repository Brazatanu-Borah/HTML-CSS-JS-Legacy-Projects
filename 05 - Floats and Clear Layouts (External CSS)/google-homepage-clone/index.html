<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Google homepage clone | HTML CSS</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>

    <!-- =================== START: Header =================== -->

    <!-- 🧿 TAG CHOICE: Using <header> because this element contains
         introductory/navigation content for the page. -->
    <header>

      <!-- 🧿 TAG CHOICE: Using <nav> because this section contains
           navigation links to other parts of the site. -->
      <nav id="site-header">

        <!-- 🧿 TAG CHOICE: Using <ul> because the navigation links form
             a list of related items. -->
        <ul>

          <li><a href="#">Gmail</a></li>
          <li><a href="#">Images</a></li>

          <!-- 📚 STUDY NOTE: Decorative interface icons still need
               meaningful alternative text when they convey information.
               An empty alt is appropriate when an image is purely decorative. -->
          <li class="labs">
            <a href="#" id="lab-icon">
              <img src="./images/lab_icon.svg" alt="">
            </a>
          </li>

          <li class="apps">
            <a href="#">
              <img src="./images/bars.png" alt="">
            </a>
          </li>

          <li class="avatar">
            <a href="#">B</a>
          </li>

        </ul>

      </nav>

    </header>

    <!-- =================== END: Header ===================== -->


    <!-- =================== START: Main Content =================== -->

    <!-- 🧿 TAG CHOICE: Using <main> because this contains the primary
         content of the page and should be unique within the document. -->
    <main id="main-container">

      <h1 id="brand-logo">
        Google
      </h1>

      <!-- 🧿 TAG CHOICE: Using <form> because the search controls represent
           a user-submitted search action. -->
      <form>

        <!-- 📚 STUDY NOTE: type="search" is appropriate for a search field
             because it identifies the input specifically as search content. -->
        <input type="search" class="search" />

        <input type="submit" value="Google Search" class="submit-1" />
        <input type="submit" value="I'm Feeling Lucky" class="submit-2" />

        <!-- 📚 STUDY NOTE: These images are interface icons positioned
             around the search field. Because they are decorative here,
             empty alt attributes prevent unnecessary screen-reader output. -->
        <img src="./images/search_icon.png" alt="" class="search-icon" />
        <img src="./images/mic_icon.png" alt="" class="mic-icon" />
        <img src="./images/google_lens.png" alt="" class="google-lens-icon" />

      </form>

      <p class="notes">
        <small>
          Google offered in:
          <a href="">हिन्दी</a>
          <a href="">বাংলা</a>
          <a href="">తెలుగు</a>
          <a href="">मराठी</a>
          <a href="">தமிழ்</a>
          <a href="">ગુજરાતી</a>
          <a href="">ಕನ್ನಡ</a>
          <a href="">മലയാളം</a>
          <a href="">ਪੰਜਾਬੀ</a>
        </small>
      </p>

    </main>

    <!-- =================== END: Main Content ===================== -->


    <!-- =================== START: Footer =================== -->

    <!-- 🧿 TAG CHOICE: Using <footer> because this contains
         page-level footer information and navigation. -->
    <footer>

      <p class="prefooter">India</p>

      <!-- 📚 STUDY NOTE: The clearfix class is a CSS/layout trick rather
           than an HTML feature. It is commonly used with older float-based
           layouts to make a parent contain its floated children. -->
      <nav class="clearfix">

        <ul>
          <li><a href="#">About</a></li>
          <li><a href="#">Advertising</a></li>
          <li><a href="#">Business</a></li>
          <li><a href="#">How Search works</a></li>
        </ul>

        <ul class="right-links">
          <li><a href="#">Privacy</a></li>
          <li><a href="#">Terms</a></li>
          <li><a href="#">Settings</a></li>
        </ul>

      </nav>

    </footer>

    <!-- =================== END: Footer ===================== -->

  </body>

</html>
